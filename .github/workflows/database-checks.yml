name: Database checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sql-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase without project migrations
        run: |
          set -euo pipefail
          mkdir -p /tmp/shop-migrations
          find supabase/migrations -maxdepth 1 -type f -name "*.sql" -exec mv {} /tmp/shop-migrations/ \;
          supabase start
          find /tmp/shop-migrations -maxdepth 1 -type f -name "*.sql" -exec mv {} supabase/migrations/ \;

      - name: Load canonical schema and migrations
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Database lint
        run: supabase db lint --local --level error
