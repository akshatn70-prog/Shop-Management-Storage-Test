name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name, for example 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "App version code; increase this for every release"
        required: true
        default: "1"

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Configure native Android SQL download
        run: node scripts/configure-android-download.mjs

      - name: Configure email verification deep link
        run: node scripts/configure-android-deeplink.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shop-management-release.jks"

      - name: Configure release signing and version
        env:
          ANDROID_VERSION_NAME: ${{{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{{ inputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{{ runner.temp }}/shop-management-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release.mjs

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{{ runner.temp }}/shop-management-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Shop-Management-${{{ inputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-management-android-${{{ inputs.version_name }}
          path: release/Shop-Management-${{{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{{ inputs.version_name }}
          name: Shop Management v${{{ inputs.version_name }}
          generate_release_notes: true
          files: release/Shop-Management-${{{ inputs.version_name }}.apk
